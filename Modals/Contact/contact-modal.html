<div id="contact-modal" class="modal">
    <div class="modal-content bento-tile">
        <span class="close-modal">&times;</span>
        <h3>Contactez-moi</h3>
        <form id="contact-form">
            <div class="form-group"><input type="text" placeholder="Nom complet" required></div>
            <div class="form-group"><input type="email" placeholder="Votre Email" required></div>
            <div class="form-group"><textarea placeholder="Votre message..." rows="5" required></textarea></div>
            <button type="submit" class="btn-premium">
                <span class="icon-wrap purple"><i class="fa-solid fa-paper-plane"></i></span>
                Envoyer
            </button>
        </form>
    </div>
</div>

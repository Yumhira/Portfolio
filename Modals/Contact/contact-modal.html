<div id="contact-modal" class="modal">
    <div class="modal-content">

        <!-- HEADER -->
        <div class="contact-modal-header">
            <div class="contact-header-left">
                <div class="contact-header-icon">
                    <i class="fa-solid fa-paper-plane"></i>
                </div>
                <div class="contact-header-text">
                    <h2>Contactez-moi</h2>
                    <p>Je réponds sous 24h</p>
                </div>
            </div>
            <button class="close-modal contact-close-btn" aria-label="Fermer">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- BODY -->
        <div class="contact-modal-body">

            <!-- Formulaire -->
            <div id="contact-form-container">
                <form id="contact-form">
                    <div class="form-group">
                        <input type="text" name="from_name" placeholder="Nom complet" required>
                    </div>
                    <div class="form-group">
                        <input type="email" name="reply_to" placeholder="Votre Email" required>
                    </div>
                    <div class="form-group">
                        <textarea name="message" placeholder="Votre message..." rows="5" required></textarea>
                    </div>
                    <button type="submit" class="btn-premium">
                        <span class="icon-wrap">
                            <i class="fa-solid fa-paper-plane"></i>
                        </span>
                        Envoyer
                    </button>
                </form>
            </div>

            <!-- Message de succès (caché par défaut) -->
            <div id="contact-success" style="display: none;">
                <div class="icon-wrap">
                    <i class="fa-solid fa-check"></i>
                </div>
                <h4>Message Envoyé !</h4>
                <p>Merci, je vous répondrai dans les plus brefs délais.</p>
            </div>

        </div>

    </div>
</div>

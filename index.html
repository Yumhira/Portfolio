<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Icônes : Font Awesome + DevIcon pour les langages -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">
    <link rel="stylesheet" href="index.css">
    <title>Bento Portfolio SISR</title>
</head>

<body>
    <div id="bento-grid-container">

        <!-- COLONNE GAUCHE -->
        <div class="column-left">

            <!-- BLOC PROFIL -->
            <div id="tile-profil" class="bento-tile">
                <div class="profil-grid">
                    <div class="profil-photo">
                        <img src="assets/Haytham.png" alt="Photo de Profil">
                    </div>

                    <div class="profil-info">
                        <h1 class="profil-name">Haytham CLEMENT</h1>
                        <p class="profil-title">Étudiant BTS SIO option SISR</p>
                        <div class="profil-socials">
                            <a href="#" target="_blank"><i class="fa-brands fa-linkedin"></i> LinkedIn</a>
                            <a href="#" target="_blank"><i class="fa-brands fa-github"></i> GitHub</a>
                        </div>
                    </div>

                    <div class="profil-cv">
                        <button class="btn-cv"><i class="fa-solid fa-download"></i> CV</button>
                    </div>

                    <div class="profil-contact">
                        <button class="btn-contact">
                            <span class="icon-bg-purple">
                                <i class="fa-solid fa-comment-dots"></i>
                            </span>
                            Message Me
                        </button>
                    </div>
                </div>
            </div>

            <!-- COMPÉTENCES -->
            <div id="grid-skills">
                <div class="skill-bloc bento-tile">
                    <h3>Front-End</h3>
                    <div class="skill-list">
                        <div class="skill-pill border-html"><i class="devicon-html5-plain colored"></i> HTML</div>
                        <div class="skill-pill border-css"><i class="devicon-css3-plain colored"></i> CSS</div>
                        <div class="skill-pill border-js"><i class="devicon-javascript-plain colored"></i> Javascript
                        </div>
                        <div class="skill-pill border-angular"><i class="devicon-angularjs-plain colored"></i> Angular
                        </div>
                        <div class="skill-pill border-wp"><i class="devicon-wordpress-plain"></i> WordPress</div>
                    </div>
                </div>

                <div class="skill-bloc bento-tile">
                    <h3>Back-End</h3>
                    <div class="skill-list">
                        <div class="skill-pill border-php"><i class="devicon-php-plain colored"></i> PHP</div>
                        <div class="skill-pill border-symfony"><i class="devicon-symfony-original"></i> Symfony</div>
                        <div class="skill-pill border-mysql"><i class="devicon-mysql-plain colored"></i> MySQL</div>
                    </div>
                </div>

                <div class="skill-bloc bento-tile">
                    <h3>Réseau & Infra</h3>
                    <div class="skill-list">
                        <div class="skill-pill border-packet"><i class="fa-solid fa-diagram-project"></i> Packet Tracer
                        </div>
                        <div class="skill-pill border-ip"><i class="fa-solid fa-network-wired"></i> Adressage IP</div>
                        <div class="skill-pill border-glpi"><i class="fa-solid fa-toolbox"></i> GLPI</div>
                        <div class="skill-pill border-virtual"><i class="fa-solid fa-server"></i> Virtualisation</div>
                    </div>
                </div>
            </div>

            <!-- À PROPOS / PARCOURS -->
            <div id="grid-dual">
                <div class="dual-bloc bento-tile">À Propos</div>
                <div class="dual-bloc bento-tile">Parcours</div>
            </div>

        </div>

        <!-- COLONNE DROITE -->
        <div class="column-right-grid">
            <div id="tile-veille" class="bento-tile">Veille Technologique</div>
            <div id="tile-certifs" class="bento-tile">Certifications</div>
            <div id="tile-realisations" class="bento-tile">Réalisations</div>
        </div>

    </div>
</body>

</html>

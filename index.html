<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Bento Portfolio SISR</title>
</head>

<body>
    <!-- CADRE PRINCIPAL (one-screen) -->
    <div id="bento-grid-container">

        <!-- --- COLONNE GAUCHE (Technique & Identité) --- -->
        <div class="column-left">

            <!-- BLOC PROFIL -->
            <div id="tile-profil" class="bento-tile">
                <div class="profil-content">
                    Mon Profil SISR
                </div>
            </div>

            <!-- COMPÉTENCES (3 Blocs) -->
            <div id="grid-skills">
                <div class="skill-bloc bento-tile">Front</div>
                <div class="skill-bloc bento-tile">Back</div>
                <div class="skill-bloc bento-tile">Réseau</div>
            </div>

            <!-- À PROPOS / PARCOURS -->
            <div id="grid-dual">
                <div class="dual-bloc bento-tile">À Propos</div>
                <div class="dual-bloc bento-tile">Parcours</div>
            </div>

        </div> <!-- Fin de la colonne gauche -->

        <!-- --- COLONNE DROITE (Grille Spéciale en L) --- -->
        <div class="column-right-grid">

            <!-- VEILLE TECHNOLOGIQUE -->
            <div id="tile-veille" class="bento-tile">Veille Technologique</div>

            <!-- CERTIFICATIONS (Carré haut droit) -->
            <div id="tile-certifs" class="bento-tile">Certifications</div>

            <!-- RÉALISATIONS (En L : occupe toute la rangée du bas) -->
            <div id="tile-realisations" class="bento-tile">Réalisations</div>

        </div> <!-- Fin de la colonne droite -->

    </div> <!-- Fin du bento-grid-container -->
</body>

</html>
